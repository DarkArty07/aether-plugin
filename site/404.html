<!-- GitHub Pages serves this file at any missing path, so on http(s) the links must resolve from the site root, not from the broken URL. From file:// the relative links already work. -->
<script>
(function () {
  if (location.protocol === 'file:') return;
  var project = /\.github\.io$/.test(location.hostname) && /^\/aether-plugin(\/|$)/.test(location.pathname);
  var b = document.createElement('base');
  b.href = project ? '/aether-plugin/' : '/';
  document.head.insertBefore(b, document.head.firstChild);
})();
</script>

<script>
/* With reduced motion asked for, the GIF is replaced by a still of its first frame. */
(function () {
  var img = document.getElementById('lost');
  if (!img || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function still() {
    var c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.setAttribute('role', 'img'); c.setAttribute('aria-label', img.alt);
    c.style.cssText = 'display:block;width:100%;height:auto';
    try { c.getContext('2d').drawImage(img, 0, 0); img.replaceWith(c); } catch (e) { /* keep the GIF */ }
  }
  if (img.complete && img.naturalWidth) still(); else img.addEventListener('load', still);
})();
</script>
